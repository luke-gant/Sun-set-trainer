name: Train Sunset Neural Network

on:
  workflow_dispatch: # Run on demand after scoring days

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib

      - name: Train Neural Network
        run: python train_model.py

      - name: Commit Model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sunset_model.joblib
          if git diff --staged --quiet; then
            echo "No model changes detected."
          else
            git commit -m "Update trained sunset prediction neural network"
            git push
          fi
