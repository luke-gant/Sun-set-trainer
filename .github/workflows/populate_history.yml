name: Populate 100-Day Sunset History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-population:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Open-Meteo script
        run: python populate_100_days.py

      - name: Commit updated CSV back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add eugene_sunset_last_100_days.csv
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Populate 100-day historical weather data for Eugene"
            git push
          fi
