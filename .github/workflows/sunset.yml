name: Daily Sunset Checker

on:
  schedule:
    # 22:47 UTC = 3:47 PM PDT / 2:47 PM PST
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sunset-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Sunset Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sunset_checker.py

      - name: Commit and push dataset updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sunset_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: log daily sunset atmospheric features [skip ci]" && git push)
