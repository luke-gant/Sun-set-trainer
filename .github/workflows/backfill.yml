name: One-Time Corvallis Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Corvallis Backfill
        run: python backfill_corvallis.py

      - name: Commit backfilled CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sunset_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: backfill corvallis sunset history [skip ci]" && git push)
